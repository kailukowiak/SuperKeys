# SuperKeys - Cross-platform Hyper Key Configuration
# Caps Lock as Hyper key with vim-style navigation
#
# Design principle: every binding here must send literal cursor/media keys or
# resolve at the OS level, so it behaves identically in every app. Commands
# that apps interpret themselves (find, undo, close-tab, ...) are
# deliberately NOT bound - use each program's native shortcut for those.
# Sole exception: the clipboard keys, which earn their spot by working in
# terminals too.

[ids]
*

[main]
# Caps Lock: tap for Escape, hold for Hyper
capslock = overload(hyper, esc)

[hyper]
# Keys not bound here fall through to [main], so unmapped letters type
# normally and held Ctrl/Alt combine with the bindings below. Modifier
# variants live in the composite layers at the bottom of this file - keyd
# does not accept a modifier prefix on the left-hand side of a binding.

# Caps+Esc toggles CapsLock
esc = capslock

# language/emoji switcher
space = C-space

# navigation
h = left
j = down
k = up
l = right

# word/line/page nav
a = C-left
e = C-right
u = home
o = end
d = pagedown
f = pageup

# home-row enter (literal key, universal)
; = enter

# deletion
n = C-backspace
m = backspace
, = delete
. = C-delete

# copy/paste (Ctrl+Shift so it works in terminals - deliberate exception to
# the app-independence rule: worth it everywhere except a few apps like
# Chrome, where C-S-c opens DevTools; use native Ctrl+C there)
c = C-S-c
v = C-S-v
x = C-S-x

# window control (OS-level, app-independent)
q = M-f4
tab = M-tab

# media controls (OS-level, app-independent)
p = playpause
[ = volumedown
] = volumeup

# Hyper as real Super for app shortcuts
1 = M-1
2 = M-2
3 = M-3
4 = M-4
5 = M-5
6 = M-6
7 = M-7
8 = M-8
9 = M-9
0 = M-0
g = M-g
r = M-r
t = M-t

# Hyper + Shift. keyd activates this layer only when both are held; keys not
# bound here fall through to [hyper] with Shift still applied.
[hyper+shift]

# selection versions of the navigation keys
h = S-left
j = S-down
k = S-up
l = S-right

# word/line selection
a = C-S-left
e = C-S-right
u = S-home
o = S-end

# window control
tab = M-S-tab

# media
p = mute

# Hyper + Alt
[hyper+alt]

# emoji switcher
space = C-M-space
